<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeismicMonitor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>SeismicMonitor</h1>
        <p>Earthquake alerts and citizen reports</p>
    </header>

    <main>
        <div class="toolbar">
            <button id="show-all" class="tab active">All alerts</button>
            <button id="show-active" class="tab">Active alerts</button>
            <button id="refresh">Refresh</button>
        </div>

        <p id="status-message" class="status-message"></p>
        <section id="alerts"></section>
    </main>

    <script src="app.js"></script>
</body>
</html>
