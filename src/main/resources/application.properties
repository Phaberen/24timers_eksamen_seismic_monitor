spring.application.name=SeismicMonitor

# --- MySQL datasource (started via compose.yml: docker compose up -d mysql) ---
spring.datasource.url=jdbc:mysql://localhost:3306/seismicmonitor
spring.datasource.username=seismic
spring.datasource.password=seismic

# --- JPA / Hibernate ---
# 'update' keeps the schema in sync during the exam without losing data on restart.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true